<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>carrossel-imagens-tema-tutorial · preview</title>
<style>
  body {
    margin: 0; padding: 32px;
    background: #0E0E0E;
    color: #FBF9F4;
    font-family: 'Source Serif 4', Georgia, serif;
  }
  h1 {
    margin: 0 0 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 24px;
  }
  .slide-card {
    background: #1a1a1a;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .slide-card img {
    width: 100%;
    display: block;
    aspect-ratio: 3 / 4;
    object-fit: cover;
  }
  .slide-card .label {
    padding: 12px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.05em;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <h1>clinica-confirmacao-consulta-n8n — preview</h1>
  <div class="grid">
    <div class="slide-card">
      <img src="slide-01.png" alt="">
      <div class="label">slide-01.png</div>
    </div>
    <div class="slide-card">
      <img src="slide-02.png" alt="">
      <div class="label">slide-02.png</div>
    </div>
    <div class="slide-card">
      <img src="slide-03.png" alt="">
      <div class="label">slide-03.png</div>
    </div>
    <div class="slide-card">
      <img src="slide-04.png" alt="">
      <div class="label">slide-04.png</div>
    </div>
    <div class="slide-card">
      <img src="slide-05.png" alt="">
      <div class="label">slide-05.png</div>
    </div>
    <div class="slide-card">
      <img src="slide-06.png" alt="">
      <div class="label">slide-06.png</div>
    </div>
    <div class="slide-card">
      <img src="slide-07.png" alt="">
      <div class="label">slide-07.png</div>
    </div>
  </div>
</body>
</html>
